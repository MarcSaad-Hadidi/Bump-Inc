name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build -t bump-public-site .
      - run: docker run -d --name bump-public-site -p 4180:3000 bump-public-site
      - run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:4180/ --output /tmp/bump-fr.html
          curl --fail http://127.0.0.1:4180/en --output /tmp/bump-en.html
          grep -q 'lang="fr"' /tmp/bump-fr.html
          grep -q 'lang="en"' /tmp/bump-en.html
      - run: docker logs bump-public-site
        if: failure()
      - run: docker rm -f bump-public-site
        if: always()

  quality:
    # Pin the OS so ubuntu-latest upgrades do not introduce slow browser setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bump
          POSTGRES_PASSWORD: ci_disposable_database_only
          POSTGRES_DB: bump_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bump -d bump_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://bump:ci_disposable_database_only@127.0.0.1:5432/bump_test
      REDIS_URL: redis://127.0.0.1:6379/1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit:dependencies
      - run: pnpm test:integration
      # Tests use headless Chromium; install its shell only. Do not run apt on
      # every CI execution (Ubuntu runners already contain browser system libs).
      - name: Install Playwright headless Chromium
        run: pnpm exec playwright install --only-shell chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: cp .env.example .env
      - run: docker compose --profile app config --quiet
      - run: docker compose --profile app up --build -d --wait --wait-timeout 180
      - run: node scripts/compose-smoke.mjs
      - run: docker compose --profile app logs --no-color
        if: failure()
      - run: docker compose --profile app down --volumes
        if: always()
