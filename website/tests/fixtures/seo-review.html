<!doctype html><html lang="fr"><meta charset="utf-8"><title>Bump — contrôle responsive</title><style>body{margin:0;background:#d6d9d0;font:14px system-ui}header{height:54px;display:flex;align-items:center;justify-content:center;gap:16px}iframe{display:block;margin:0 auto 30px;border:0;max-width:none;background:#f4f1e8}select,button{padding:5px}button[aria-pressed=true]{background:#283e22;color:white}</style><header><label>Page <select id="page"><option value="/">Accueil</option><option value="/en">Accueil EN</option><option value="/expertises">Expertises</option><option value="/services/automatisation-processus">Workflow</option><option value="/services/integration-ia">IA</option><option value="/services/developpement-logiciel">Logiciels</option><option value="/services/cybersecurite">Cybersécurité</option><option value="/approche">Approche</option><option value="/a-propos">Bump</option><option value="/faq">FAQ</option><option value="/en/services/ai-integration">English · AI</option></select></label><button data-width="320" aria-pressed="false">320 × 740</button><button data-width="390" aria-pressed="true">390 × 844</button><button data-width="768" aria-pressed="false">768 × 1024</button><button data-width="1024" aria-pressed="false">1024 × 768</button><button data-width="1877" data-height="861">1877 × 861</button><button data-width="1366" data-height="650">1366 × 650</button><button data-width="1920" data-height="1080">1920 × 1080</button><button id="previous">Arrêt précédent</button><button id="next">Arrêt suivant</button><button id="scripts" aria-pressed="false">Sans JavaScript</button><span id="report"></span></header><iframe id="frame" width="390" height="844" title="Page Bump"></iframe><script>const frame=document.getElementById('frame'),select=document.getElementById('page');frame.src=select.value;select.onchange=()=>{frame.src=select.value};for(const button of document.querySelectorAll('button[data-width]'))button.onclick=()=>{frame.width=button.dataset.width;frame.height=button.dataset.height||(button.dataset.width==='320'?740:button.dataset.width==='390'?844:button.dataset.width==='768'?1024:768);for(const peer of document.querySelectorAll('button[data-width]'))peer.setAttribute('aria-pressed',String(peer===button));};document.getElementById('scripts').onclick=event=>{const off=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(off));if(off)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src=select.value;};for(const [id,key] of [['previous','PageUp'],['next','PageDown']])document.getElementById(id).onclick=()=>{frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));};frame.onload=()=>{document.getElementById('report').textContent='Chargé';};</script></html>
