<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Bump — vérification mobile</title>
<style>body{margin:0;background:#deded8;font:13px system-ui;color:#263b2d}nav{padding:8px;display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;background:#deded8;z-index:2}button,select{padding:7px;border:1px solid #9ca797;background:#fff;border-radius:5px}main{display:flex;justify-content:center;padding:8px}iframe{width:390px;height:780px;border:0;background:#f4f1e8;box-shadow:0 0 0 1px #aaa}output{align-self:center}pre{margin:8px;white-space:pre-wrap;max-width:1200px}fieldset{border:0;padding:0;display:flex;gap:6px;align-items:center}</style>
<nav aria-label="Formats"><button onclick="size(360,700)">360 × 700</button><button onclick="size(390,780)">390 × 780</button><button onclick="size(430,820)">430 × 820</button><button onclick="size(740,390)">Paysage</button><button onclick="size(390,860)">Barre repliée</button><button onclick="edition('/')">FR</button><button onclick="edition('/en')">EN</button><output id="size">390 × 780</output></nav>
<nav aria-label="Gestes et capteur"><select id="zone" aria-label="Zone du geste"><option value=".5">Au milieu de l’écran</option><option value=".85">Vers le bas</option><option value=".02">Près du bord</option></select><button onclick="swipe(1)">Geste ↑</button><button onclick="swipe(-1)">Geste ↓</button><button onclick="swipe(1,true)">Geste long ↑</button><button onclick="diagnose()">Diagnostic WebGL</button><button onclick="settleCapture()">Préparer la capture</button><button onclick="tilt(-16)">Incliner à gauche</button><button onclick="tilt(16)">Incliner à droite</button><button onclick="tilt(0)">Centrer</button></nav>
<main><iframe id="mobile" title="Bump sur téléphone" src="/" allow="accelerometer; gyroscope"></iframe></main><pre id="report" role="status">Prêt.</pre>
<script>
const frame=document.getElementById('mobile'),report=document.getElementById('report');
function edition(path){report.textContent='Chargement…';frame.onload=()=>{report.textContent='Page chargée.'};frame.src=path}
function size(w,h){frame.style.width=w+'px';frame.style.height=h+'px';document.getElementById('size').textContent=w+' × '+h}
function diagnose(){const w=frame.contentWindow,d=w.document;const check=doc=>{const c=doc.createElement('canvas');let error='';c.addEventListener('webglcontextcreationerror',e=>error=e.statusMessage);const gl=c.getContext('webgl2');const result={webgl2:!!gl,error,renderer:gl?.getParameter(gl.RENDERER)};gl?.getExtension('WEBGL_lose_context')?.loseContext();return result};const policy=d.permissionsPolicy||d.featurePolicy;report.textContent=JSON.stringify({frame:check(d),top:check(document),secure:w.isSecureContext,orientation:typeof w.DeviceOrientationEvent,coarse:w.matchMedia('(pointer: coarse)').matches,canvas:d.querySelectorAll('canvas').length,gyroscope:policy?.allowsFeature('gyroscope'),accelerometer:policy?.allowsFeature('accelerometer')},null,2)}
async function settleCapture(){report.textContent='Capture en préparation…';const d=frame.contentDocument;await d.fonts.ready;await Promise.all([...d.querySelectorAll('.static-fallback-wrapper img')].filter(i=>getComputedStyle(i.parentElement).visibility!=='hidden').map(i=>i.decode().catch(()=>{})));await Promise.all(d.getAnimations().filter(a=>Number.isFinite(a.effect?.getTiming().iterations)).map(a=>a.finished.catch(()=>{})));report.textContent='Capture prête · '+(d.querySelector('canvas[data-engine]')?'WebGL':'mode de secours')}

function tilt(gamma){const w=frame.contentWindow;if(!w.DeviceOrientationEvent){report.textContent='Capteur indisponible dans ce navigateur de test.';return}w.dispatchEvent(new w.DeviceOrientationEvent('deviceorientation',{beta:45,gamma,alpha:0}));report.textContent=JSON.stringify({gamma,state:w.document.documentElement.dataset.bumpGyro},null,2)}
async function swipe(direction,large=false){
 report.textContent='Geste en cours…';
 const w=frame.contentWindow,d=w.document,root=d.documentElement,x=w.innerWidth*Number(document.getElementById('zone').value),y=w.innerHeight*(direction>0?.72:.32),target=d.elementFromPoint(x,y)||d.body,start=w.scrollY,events=[];
 const dispatch=(type,offset)=>{const point=new w.Touch({identifier:1,target,clientX:x,clientY:y-offset,screenX:x,screenY:y-offset,pageX:x,pageY:y-offset+w.scrollY,radiusX:5,radiusY:5,force:.5});const event=new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[point],targetTouches:type==='touchend'?[]:[point],changedTouches:[point]});target.dispatchEvent(event);events.push({type,offset,prevented:event.defaultPrevented});};
 dispatch('touchstart',0);for(const offset of [3,12,36,70,large?280:110]){dispatch('touchmove',offset*direction);await new Promise(requestAnimationFrame)}dispatch('touchend',(large?280:110)*direction);
 const trace=[start,w.scrollY],deadline=performance.now()+10000;while(root.dataset.bumpScrollMoving==='true'&&performance.now()<deadline){await new Promise(requestAnimationFrame);trace.push(w.scrollY)}
 const continuous=trace.every((y,i)=>!i||(y-trace[i-1])*direction>=-1);
 report.textContent=JSON.stringify({target:target.tagName+'.'+String(target.className?.baseVal??target.className),start,end:w.scrollY,stop:root.dataset.bumpScrollStop,moving:root.dataset.bumpScrollMoving,continuous,frames:trace.length,events},null,2);
}
</script></html>
