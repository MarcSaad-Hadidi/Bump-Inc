version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Breaking npm upgrades are reviewed as dedicated migration tasks.
    # Keep weekly patch/minor version updates and security updates enabled.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Docker images must remain aligned with .node-version and package.json.
    # A Node major upgrade needs its own compatibility migration and full CI.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
