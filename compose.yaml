name: bump-os

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local database password}
      POSTGRES_DB: ${POSTGRES_DB:-bump}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set the local application database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
      - ./infra/postgres/init-runtime.sh:/docker-entrypoint-initdb.d/20-runtime.sh:ro
      - ./infra/postgres/create-runtime.sql:/opt/bump/create-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 100

  s3-test:
    profiles: [test]
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: bump_ci_disposable
      AWS_SECRET_ACCESS_KEY: bump_ci_s3_disposable_only
      S3_BUCKET: bump-ingestion-test
    ports:
      - "127.0.0.1:8333:8333"
    logging:
      driver: none

  migrate:
    profiles: [app]
    build:
      context: .
      target: api
    command: ["node", "node_modules/@bump/db/dist/migrate.js"]
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bump}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://bump_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-bump}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set the local auth signing secret}
      AUTH_BASE_URL: http://127.0.0.1:3001
      AUTH_ALLOW_SIGNUP: ${AUTH_ALLOW_SIGNUP:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: noreply@bump.local
      ARTIFACT_BACKEND: local
      ARTIFACT_LOCAL_ROOT: /var/lib/bump/artifacts
    volumes:
      - audit-artifacts:/var/lib/bump/artifacts
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3001/health/ready").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

  worker:
    profiles: [app]
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      WORKER_PORT: 3002
      DATABASE_URL: postgresql://bump_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-bump}
      REDIS_URL: redis://redis:6379
      ARTIFACT_BACKEND: local
      ARTIFACT_LOCAL_ROOT: /var/lib/bump/artifacts
    volumes:
      - audit-artifacts:/var/lib/bump/artifacts
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3002/health/ready").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

  web:
    profiles: [app]
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3000").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  audit-artifacts:
