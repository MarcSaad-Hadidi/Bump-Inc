name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/cyber-**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build -t bump-public-site .
      - run: docker run -d --name bump-public-site -p 4180:3000 bump-public-site
      - run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:4180/ --output /tmp/bump-fr.html
          curl --fail http://127.0.0.1:4180/en --output /tmp/bump-en.html
          grep -q 'lang="fr"' /tmp/bump-fr.html
          grep -q 'lang="en"' /tmp/bump-en.html
      - run: docker logs bump-public-site
        if: failure()
      - run: docker rm -f bump-public-site
        if: always()

  quality:
    # Pin the OS so ubuntu-latest upgrades do not introduce slow browser setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bump
          POSTGRES_PASSWORD: ci_disposable_database_only
          POSTGRES_DB: bump_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bump -d bump_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://bump_app:ci_disposable_runtime_only@127.0.0.1:5432/bump_test
      MIGRATION_DATABASE_URL: postgresql://bump:ci_disposable_database_only@127.0.0.1:5432/bump_test
      APP_DATABASE_PASSWORD: ci_disposable_runtime_only
      REDIS_URL: redis://127.0.0.1:6379/1
      S3_TEST_ENDPOINT: http://127.0.0.1:8333
      S3_TEST_BUCKET: bump-ingestion-test
      S3_TEST_ACCESS_KEY_ID: bump_ci_disposable
      S3_TEST_SECRET_ACCESS_KEY: bump_ci_s3_disposable_only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit:dependencies
      - run: psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --set=app_password="$APP_DATABASE_PASSWORD" --file=infra/postgres/create-runtime.sql
      - run: pnpm db:migrate
      - name: Start disposable authenticated S3 service
        run: >-
          docker run --detach --name bump-s3-ci --log-driver none
          --publish 127.0.0.1:8333:8333
          --env AWS_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY_ID"
          --env AWS_SECRET_ACCESS_KEY="$S3_TEST_SECRET_ACCESS_KEY"
          --env S3_BUCKET="$S3_TEST_BUCKET"
          chrislusf/seaweedfs:4.48 mini -dir=/data
      - run: pnpm test:integration
      - name: Prepare pinned Cyber tools and public vulnerability DB
        run: pnpm cyber:tools
      - name: Real isolated Cyber scanner and queue acceptance
        run: pnpm test:scanners
      - name: Safe Cyber host capabilities
        if: always()
        run: node scripts/cyber-doctor.mjs --require-native
      # Tests use headless Chromium; install its shell only. Do not run apt on
      # every CI execution (Ubuntu runners already contain browser system libs).
      - name: Install Playwright headless Chromium
        run: pnpm exec playwright install --only-shell chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
      - name: Remove disposable S3 service
        if: always()
        run: |
          if docker container inspect bump-s3-ci >/dev/null 2>&1; then
            docker rm --force bump-s3-ci
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: cp .env.example .env
      - run: docker compose --profile app config --quiet
      - run: docker compose --profile app up --build -d --wait --wait-timeout 180
      - run: node scripts/compose-smoke.mjs
      - run: docker compose --profile app logs --no-color
        if: failure()
      - run: docker compose --profile app down --volumes
        if: always()
